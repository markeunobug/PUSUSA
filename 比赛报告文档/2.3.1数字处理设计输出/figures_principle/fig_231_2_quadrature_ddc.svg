   <g id="text_1">
    <text style="font-weight: 700; font-size: 16px; font-family: 'Microsoft YaHei', 'SimHei', 'Arial Unicode MS', 'DejaVu Sans', sans-serif; text-anchor: start; fill: #111827" x="33.984" y="37.4536" transform="rotate(-0 33.984 37.4536)">数字正交下变频原理</text>
   </g>
   <g id="text_2">
    <text style="font-size: 9.5px; font-family: 'Microsoft YaHei', 'SimHei', 'Arial Unicode MS', 'DejaVu Sans', sans-serif; text-anchor: start; fill: #4b5563" x="33.984" y="51.661662" transform="rotate(-0 33.984 51.661662)">将固定中频搬移到零频附近，形成便于滤波和功率检测的复基带信号。</text>
   </g>
   <g id="text_3">
    <text style="font-weight: 700; font-size: 10px; font-family: 'Microsoft YaHei', 'SimHei', 'Arial Unicode MS', 'DejaVu Sans', sans-serif; fill: #111827" transform="translate(90.988 157.12635)">采样中频</text>
    <text style="font-weight: 700; font-size: 10px; font-family: 'Microsoft YaHei', 'SimHei', 'Arial Unicode MS', 'DejaVu Sans', sans-serif; fill: #111827" transform="translate(100.926281 169.364662)">x[n]</text>
   </g>
   <g id="text_4">
    <text style="font-size: 9.5px; font-family: 'Microsoft YaHei', 'SimHei', 'Arial Unicode MS', 'DejaVu Sans', sans-serif; text-anchor: middle; fill: #111827" x="288.432" y="116.538211" transform="rotate(-0 288.432 116.538211)">cos(2πfIF n/fs)</text>
   </g>
   <g id="text_5">
    <text style="font-size: 9.5px; font-family: 'Microsoft YaHei', 'SimHei', 'Arial Unicode MS', 'DejaVu Sans', sans-serif; text-anchor: middle; fill: #111827" x="288.432" y="213.558211" transform="rotate(-0 288.432 213.558211)">-sin(2πfIF n/fs)</text>
   </g>
   <g id="text_6">
    <text style="font-weight: 700; font-size: 9.5px; font-family: 'Microsoft YaHei', 'SimHei', 'Arial Unicode MS', 'DejaVu Sans', sans-serif; fill: #111827" transform="translate(423.44 110.725012)">低通滤波</text>
    <text style="font-weight: 700; font-size: 9.5px; font-family: 'Microsoft YaHei', 'SimHei', 'Arial Unicode MS', 'DejaVu Sans', sans-serif; fill: #111827" transform="translate(434.066641 122.351409)">I[n]</text>
   </g>
   <g id="text_7">
    <text style="font-weight: 700; font-size: 9.5px; font-family: 'Microsoft YaHei', 'SimHei', 'Arial Unicode MS', 'DejaVu Sans', sans-serif; fill: #111827" transform="translate(423.44 207.745012)">低通滤波</text>
    <text style="font-weight: 700; font-size: 9.5px; font-family: 'Microsoft YaHei', 'SimHei', 'Arial Unicode MS', 'DejaVu Sans', sans-serif; fill: #111827" transform="translate(431.772539 219.371409)">Q[n]</text>
   </g>
   <g id="text_8">
    <text style="font-weight: 700; font-size: 9.2px; font-family: 'Microsoft YaHei', 'SimHei', 'Arial Unicode MS', 'DejaVu Sans', sans-serif; fill: #111827" transform="translate(572.604 157.373289)">复基带</text>
    <text style="font-weight: 700; font-size: 9.2px; font-family: 'Microsoft YaHei', 'SimHei', 'Arial Unicode MS', 'DejaVu Sans', sans-serif; fill: #111827" transform="translate(550.644031 168.632536)">z[n]=I[n]+jQ[n]</text>
   </g>
   <g id="text_9">
    <text style="font-weight: 700; font-size: 10.6px; font-family: 'Microsoft YaHei', 'SimHei', 'Arial Unicode MS', 'DejaVu Sans', sans-serif; text-anchor: start; fill: #111827" x="74.16" y="286.6176" transform="rotate(-0 74.16 286.6176)">作用：把 40 MHz 中频信号变换到基带，使后续 RBW 滤波只需围绕零频设计。</text>
   </g>
   <g id="text_10">
    <text style="font-size: 9.5px; font-family: 'Microsoft YaHei', 'SimHei', 'Arial Unicode MS', 'DejaVu Sans', sans-serif; text-anchor: start; fill: #4b5563" x="74.16" y="309.9024" transform="rotate(-0 74.16 309.9024)">优势：I/Q 表示同时保留幅度和相位信息，避免实数混频后正负频率混叠带来的测量误差。</text>
   </g>
  </g>
 </g>
