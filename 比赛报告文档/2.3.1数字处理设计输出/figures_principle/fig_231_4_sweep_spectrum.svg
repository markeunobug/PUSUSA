   </g>
   <g id="text_2">
    <text style="font-size: 9.5px; font-family: 'Microsoft YaHei', 'SimHei', 'Arial Unicode MS', 'DejaVu Sans', sans-serif; text-anchor: start; fill: #4b5563" x="33.984" y="51.661662" transform="rotate(-0 33.984 51.661662)">通过改变本振频率，使不同 RF 频率依次落入固定中频处理链。</text>
   </g>
   <g id="text_3">
    <text style="font-weight: 700; font-size: 9.2px; font-family: 'Microsoft YaHei', 'SimHei', 'Arial Unicode MS', 'DejaVu Sans', sans-serif; text-anchor: middle; fill: #111827" x="100.944" y="126.157594" transform="rotate(-0 100.944 126.157594)">RF频点 f1</text>
