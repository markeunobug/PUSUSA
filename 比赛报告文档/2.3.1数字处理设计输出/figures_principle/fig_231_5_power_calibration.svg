   </g>
   <g id="text_8">
    <text style="font-size: 9.2px; font-family: 'Microsoft YaHei', 'SimHei', 'Arial Unicode MS', 'DejaVu Sans', sans-serif; text-anchor: middle; fill: #111827" x="248.256" y="221.206287" transform="rotate(-0 248.256 221.206287)">P_dBFS = 10log10(P/PFS)</text>
   </g>
   <g id="text_9">
    <text style="font-size: 9.2px; font-family: 'Microsoft YaHei', 'SimHei', 'Arial Unicode MS', 'DejaVu Sans', sans-serif; text-anchor: middle; fill: #111827" x="469.224" y="221.380944" transform="rotate(-0 469.224 221.380944)">P_RF = P_ADC + 前端校正量</text>
