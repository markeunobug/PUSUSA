   <g id="text_1">
    <text style="font-weight: 700; font-size: 14px; font-family: 'Microsoft YaHei', 'SimHei', 'Arial Unicode MS', 'DejaVu Sans', sans-serif; text-anchor: start; fill: #263238" x="20.034" y="32.14037" transform="rotate(-0 20.034 32.14037)">功率估计与输入端幅度校正</text>
   </g>
   <g id="text_2">
    <text style="font-size: 8.5px; font-family: 'Microsoft YaHei', 'SimHei', 'Arial Unicode MS', 'DejaVu Sans', sans-serif; text-anchor: start; fill: #667085" x="20.034" y="46.648847" transform="rotate(-0 20.034 46.648847)">把基带样本能量转换为可读的 RF 输入端 dBm。</text>
   </g>
   <g id="text_3">
    <text style="font-size: 9.5px; font-family: 'Microsoft YaHei', 'SimHei', 'Arial Unicode MS', 'DejaVu Sans', sans-serif; fill: #263238" transform="translate(78.289648 113.882062)">RBW滤波后</text>
    <text style="font-size: 9.5px; font-family: 'Microsoft YaHei', 'SimHei', 'Arial Unicode MS', 'DejaVu Sans', sans-serif; fill: #263238" transform="translate(86.658555 125.73628)">I/Q样本</text>
   </g>
   <g id="text_4">
    <text style="font-size: 9.5px; font-family: 'Microsoft YaHei', 'SimHei', 'Arial Unicode MS', 'DejaVu Sans', sans-serif; fill: #263238" transform="translate(244.88 113.882062)">均方功率</text>
    <text style="font-size: 9.5px; font-family: 'Microsoft YaHei', 'SimHei', 'Arial Unicode MS', 'DejaVu Sans', sans-serif; fill: #263238" transform="translate(226.17168 125.73628)">P = mean(I²+Q²)</text>
   </g>
   <g id="text_5">
    <text style="font-size: 9.5px; font-family: 'Microsoft YaHei', 'SimHei', 'Arial Unicode MS', 'DejaVu Sans', sans-serif; fill: #263238" transform="translate(403.586094 113.854601)">dBFS换算</text>
    <text style="font-size: 9.5px; font-family: 'Microsoft YaHei', 'SimHei', 'Arial Unicode MS', 'DejaVu Sans', sans-serif; fill: #263238" transform="translate(389.625547 125.708819)">10log10(P/PFS)</text>
   </g>
   <g id="text_6">
    <text style="font-size: 9.5px; font-family: 'Microsoft YaHei', 'SimHei', 'Arial Unicode MS', 'DejaVu Sans', sans-serif; fill: #263238" transform="translate(536.341461 113.882062)">ADC输入功率</text>
    <text style="font-size: 9.5px; font-family: 'Microsoft YaHei', 'SimHei', 'Arial Unicode MS', 'DejaVu Sans', sans-serif; fill: #263238" transform="translate(531.080094 125.73628)">+8.02 dBm参考</text>
   </g>
   <g id="text_7">
    <text style="font-size: 10px; font-family: 'Microsoft YaHei', 'SimHei', 'Arial Unicode MS', 'DejaVu Sans', sans-serif; text-anchor: middle; fill: #263238" x="328.05" y="221.346626" transform="rotate(-0 328.05 221.346626)">幅度校正项 = 衰减器 - LNA增益 - VGA增益 + 路径校准 + 频率分段校准</text>
   </g>
   <g id="text_8">
    <text style="font-weight: 700; font-size: 10px; font-family: 'Microsoft YaHei', 'SimHei', 'Arial Unicode MS', 'DejaVu Sans', sans-serif; fill: #263238" transform="translate(296.767969 295.883644)">RF输入端幅度</text>
    <text style="font-weight: 700; font-size: 10px; font-family: 'Microsoft YaHei', 'SimHei', 'Arial Unicode MS', 'DejaVu Sans', sans-serif; fill: #263238" transform="translate(283.05 308.361769)">用于上位机频谱显示</text>
   </g>
   <g id="text_9">
    <text style="font-size: 9.2px; font-family: 'Microsoft YaHei', 'SimHei', 'Arial Unicode MS', 'DejaVu Sans', sans-serif; text-anchor: start; fill: #667085" x="58.536" y="182.50128" transform="rotate(-0 58.536 182.50128)">固件保留 raw power 与 correction dB，便于后续校准和误差分析。</text>
   </g>
