   <g id="text_2">
    <text style="font-size: 8.5px; font-family: 'Microsoft YaHei', 'SimHei', 'Arial Unicode MS', 'DejaVu Sans', sans-serif; text-anchor: start; fill: #667085" x="20.034" y="47.014082" transform="rotate(-0 20.034 47.014082)">Core conclusion: Zynq 将 40 MHz 中频转换为带 RBW 选择和幅度校正的定量频谱点。</text>
