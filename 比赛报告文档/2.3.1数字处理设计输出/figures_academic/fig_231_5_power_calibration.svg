   <g id="text_1">
    <text style="font-weight: 700; font-size: 16px; font-family: 'Microsoft YaHei', 'SimHei', 'Arial Unicode MS', 'DejaVu Sans', sans-serif; text-anchor: start; fill: #111827" x="30.636" y="37.4536" transform="rotate(-0 30.636 37.4536)">功率计算与输入端幅度校正</text>
   </g>
   <g id="text_2">
    <text style="font-size: 9.5px; font-family: 'Microsoft YaHei', 'SimHei', 'Arial Unicode MS', 'DejaVu Sans', sans-serif; text-anchor: start; fill: #4b5563" x="30.636" y="51.661662" transform="rotate(-0 30.636 51.661662)">把 RBW 滤波后的基带能量换算为 RF 输入端 dBm。</text>
   </g>
   <g id="text_3">
    <text style="font-weight: 700; font-size: 8.6px; font-family: 'Microsoft YaHei', 'SimHei', 'Arial Unicode MS', 'DejaVu Sans', sans-serif; fill: #111827" transform="translate(80.822063 125.580885)">RBW滤波后</text>
    <text style="font-weight: 700; font-size: 8.6px; font-family: 'Microsoft YaHei', 'SimHei', 'Arial Unicode MS', 'DejaVu Sans', sans-serif; fill: #111827" transform="translate(88.697781 136.105834)">I/Q样本</text>
   </g>
   <g id="text_4">
    <text style="font-weight: 700; font-size: 8.6px; font-family: 'Microsoft YaHei', 'SimHei', 'Arial Unicode MS', 'DejaVu Sans', sans-serif; fill: #111827" transform="translate(241.1 125.580885)">均方功率</text>
    <text style="font-weight: 700; font-size: 8.6px; font-family: 'Microsoft YaHei', 'SimHei', 'Arial Unicode MS', 'DejaVu Sans', sans-serif; fill: #111827" transform="translate(222.34125 136.105834)">P = mean(I²+Q²)</text>
   </g>
   <g id="text_5">
    <text style="font-weight: 700; font-size: 8.6px; font-family: 'Microsoft YaHei', 'SimHei', 'Arial Unicode MS', 'DejaVu Sans', sans-serif; fill: #111827" transform="translate(392.972781 125.560057)">dBFS换算</text>
    <text style="font-weight: 700; font-size: 8.6px; font-family: 'Microsoft YaHei', 'SimHei', 'Arial Unicode MS', 'DejaVu Sans', sans-serif; fill: #111827" transform="translate(378.770688 136.085006)">10log10(P/PFS)</text>
   </g>
   <g id="text_6">
    <text style="font-weight: 700; font-size: 8.6px; font-family: 'Microsoft YaHei', 'SimHei', 'Arial Unicode MS', 'DejaVu Sans', sans-serif; fill: #111827" transform="translate(539.583438 125.580885)">ADC输入功率</text>
    <text style="font-weight: 700; font-size: 8.6px; font-family: 'Microsoft YaHei', 'SimHei', 'Arial Unicode MS', 'DejaVu Sans', sans-serif; fill: #111827" transform="translate(533.959172 136.105834)">+8.02 dBm参考</text>
   </g>
   <g id="text_7">
    <text style="font-weight: 700; font-size: 10px; font-family: 'Microsoft YaHei', 'SimHei', 'Arial Unicode MS', 'DejaVu Sans', sans-serif; text-anchor: middle; fill: #111827" x="342" y="229.219106" transform="rotate(-0 342 229.219106)">幅度校正项 = 衰减器 - LNA增益 - VGA增益 + 路径校准 + 频率分段校准</text>
   </g>
   <g id="text_8">
    <text style="font-weight: 700; font-size: 10.5px; font-family: 'Microsoft YaHei', 'SimHei', 'Arial Unicode MS', 'DejaVu Sans', sans-serif; fill: #111827" transform="translate(309.153867 310.249687)">RF输入端幅度</text>
    <text style="font-weight: 700; font-size: 10.5px; font-family: 'Microsoft YaHei', 'SimHei', 'Arial Unicode MS', 'DejaVu Sans', sans-serif; fill: #111827" transform="translate(294.75 323.099916)">用于上位机频谱显示</text>
   </g>
   <g id="text_9">
    <text style="font-size: 9.3px; font-family: 'Microsoft YaHei', 'SimHei', 'Arial Unicode MS', 'DejaVu Sans', sans-serif; text-anchor: start; fill: #4b5563" x="54.072" y="189.5976" transform="rotate(-0 54.072 189.5976)">固件保留 raw power 与 correction dB，便于后续标定、误差分析和校准表迭代。</text>
   </g>
