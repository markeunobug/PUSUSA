name: flutter_pusu
description: A new Flutter project.

publish_to: 'none' # Remove this line if you wish to publish to pub.dev

version: 0.0.1+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  audioplayers: ^6.5.1
  collection: ^1.19.1
  crc: ^0.0.2
  convert: ^3.1.2
  flutter_libserialport: ^0.6.0
  fl_chart: ^1.1.1
  # 4.16.x currently uses Flutter UI APIs newer than the installed 3.38.7.
  # Keep the repository's previously locked compatible release.
  fluent_ui: 4.15.1
  shared_preferences: ^2.3.2
  flutter:
    sdk: flutter

  english_words: ^4.0.0
  provider: ^6.0.0
  record: ^6.2.1
  window_manager: ^0.5.1
  file_selector: ^1.1.0

# record_windows 1.x 的 CMake 最低版本声明与 Visual Studio 自带的
# CMake 3.20 不兼容。项目内副本仅将该声明恢复为插件源码实际支持的 3.14。
dependency_overrides:
  audioplayers_windows:
    path: third_party/audioplayers_windows
  record_windows:
    path: third_party/record_windows

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^2.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/imgs/logo6.png
    - assets/imgs/logo5.png
